name: MSG215 Protocol Contracts

on:
  pull_request:
    paths:
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/msg215-protocol-contracts.yml"
  push:
    branches:
      - "feature/msg213-commercial-protocol-v1"
    paths:
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/msg215-protocol-contracts.yml"

permissions:
  contents: read

jobs:
  protocol-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON syntax
        run: |
          find tests/fixtures -type f -name 'msg215_*.json' -print0 \
            | sort -z \
            | xargs -0 -n1 python -m json.tool >/dev/null
          find schemas -type f -name '*.schema.json' -print0 \
            | sort -z \
            | xargs -0 -n1 python -m json.tool >/dev/null
      - name: Run identity, entitlement, registry and trust invariants
        run: python tests/test_msg215_protocol_contracts.py
      - name: Run authentication lifecycle invariants
        run: python tests/test_msg215_auth_lifecycle.py
      - name: Run multichain network-adapter invariants
        run: python tests/test_msg215_network_adapters.py
