name: Validate Public Protocol Boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public protocol boundary
        run: python scripts/validate_public_protocol_boundary.py
      - name: Ensure operational handoffs are absent
        run: |
          test ! -d handoffs
          ! git ls-files | grep -E '^(handoffs|private|internal|ops|runtime-private)/'
